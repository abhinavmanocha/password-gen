<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Password Generator</title>
<style>
  .pw-root {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-start;
    color: var(--foreground);
    max-width: 640px;
  }
  .pw-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-end;
  }
  .pw-controls label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 12px;
    color: var(--muted-foreground);
  }
  .pw-controls select,
  .pw-controls input[type=number] {
    color: var(--foreground);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font: inherit;
    font-size: 13px;
  }
  .pw-go {
    padding: 7px 16px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--accent);
    color: var(--foreground);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .pw-go:hover { opacity: .85; }
  .pw-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }
  .pw-row { display: flex; gap: 6px; align-items: center; }
  .pw-row input {
    flex: 1;
    min-width: 240px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--foreground);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px;
    letter-spacing: .3px;
  }
  .pw-copy {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--muted-foreground);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    min-width: 58px;
  }
  .pw-copy:hover { color: var(--foreground); }
  .pw-foot {
    font-size: 12px;
    color: var(--muted-foreground);
    line-height: 1.5;
  }
  .pw-warn { color: var(--foreground); }
</style>
</head>
<body>
<div class="pw-root">
  <div class="pw-controls">
    <label>Words
      <select id="words">
        <option value="2" selected>2 &mdash; easy to type</option>
        <option value="3">3 &mdash; stronger</option>
        <option value="4">4 &mdash; very strong</option>
      </select>
    </label>
    <label>Digits
      <select id="digits">
        <option value="2" selected>2 digits</option>
        <option value="3">3 digits</option>
        <option value="4">4 digits</option>
      </select>
    </label>
    <label>How many
      <input id="count" type="number" min="1" max="50" value="6">
    </label>
    <button class="pw-go" id="go">Generate</button>
    <button class="pw-copy" id="copyAll" style="min-width:74px;padding:7px 12px">Copy all</button>
  </div>

  <div class="pw-list" id="list"></div>

  <div class="pw-foot" id="foot"></div>
</div>

<script>
const MODIFIERS = `fire milton brampton long crunchy blue happy silver copper iron golden red green
black white wild brave swift quiet loud bright dark deep high low north south
east west rocky sandy snowy rainy sunny windy stormy frosty dusty rusty mossy
foggy smoky maple cedar birch willow aspen oak pine thorn ivy jade onyx pearl
amber coral ruby ember ash snow ice steel brass glass stone brick sand river
lake ocean tidal coastal alpine timber urban rustic vintage modern turbo rapid
rocket comet meteor lunar solar stellar cosmic pixel cyber laser neon echo sonic
vinyl retro classic grand royal noble lucky jolly merry crispy juicy spicy sweet
salty zesty creamy toasty frosted silky fuzzy woolly cheeky sneaky clever witty
brisk eager steady solid prime alpha omega delta sigma mellow gentle bold sharp
smooth fresh clean tidy smart`.split(/\s+/);

const NOUNS = `fox home track snack grip place hawk wolf bear lynx otter badger beaver falcon
raven crow finch robin heron crane tiger lion panther cobra viper gecko dragon
phoenix griffin hunter ranger scout pilot captain skipper trader broker banker
baker brewer barber chef server host manager owner partner builder maker coder
writer reader rider driver walker hiker climber diver sailor route trail path
road lane street bridge tunnel harbor marina dock pier beach shore cliff canyon
valley meadow forest grove garden orchard vineyard farm ranch cabin cottage
lodge manor tower castle temple market plaza junction station depot terminal
gateway portal beacon signal radar anchor compass atlas ledger vault safe key
lock chain cable wire circuit engine motor turbine vector matrix cipher code
pixel byte cache socket packet stream buffer kernel quantum photon prism lens
mirror vibe rhythm beat tune melody chord tempo groove swing dance feast table
plate grill oven skillet kettle mug bottle barrel keg cask flask pantry cellar
kitchen counter booth patio terrace balcony atrium loft studio gallery museum
theatre arena stadium rink court field pitch green bunker summit ridge crest
peak slope basin delta oasis dune mesa bay cove creek falls spring brook`.split(/\s+/);

const LEET = { a: "@", i: "!", o: "0", e: "3", s: "$" };
const SIGNIFICANT = ["604", "905", "416", "647", "365", "289", "437",
                     "88", "99", "77", "55", "44", "22", "11", "21"];

const uniq = arr => Array.from(new Set(arr));
const M = uniq(MODIFIERS), N = uniq(NOUNS);
const pick = a => a[Math.floor(Math.random() * a.length)];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

function leetOnce(word) {
  const spots = i => word[i] && LEET[word[i].toLowerCase()] && i > 0 && i < word.length - 1;
  let opts = [];
  for (let i = 0; i < word.length; i++) if (spots(i)) opts.push(i);
  if (!opts.length) {
    for (let i = 0; i < word.length; i++) if (word[i] && LEET[word[i].toLowerCase()]) opts.push(i);
  }
  if (!opts.length) return word;
  const i = pick(opts);
  return word.slice(0, i) + LEET[word[i].toLowerCase()] + word.slice(i + 1);
}

function generate(words, digits) {
  const parts = [pick(M)];
  for (let k = 1; k < words; k++) parts.push(cap(pick(N)));
  let pw = leetOnce(parts.join(""));
  let ending;
  if (Math.floor(Math.random() * 4) === 0) {
    ending = pick(SIGNIFICANT);
  } else {
    const n = digits + (Math.random() < 0.25 ? 1 : 0);
    ending = "";
    for (let i = 0; i < n; i++) ending += Math.floor(Math.random() * 10);
    if (ending[0] === "0") ending = "7" + ending.slice(1);
  }
  return pw + ending;
}

function estBits(words, digits) {
  const combos = M.length * Math.pow(N.length, words - 1);
  return Math.log2(combos) + Math.log2(Math.pow(10, digits));
}

const list = document.getElementById("list");
const foot = document.getElementById("foot");

function render() {
  const words = +document.getElementById("words").value;
  const digits = +document.getElementById("digits").value;
  let count = +document.getElementById("count").value;
  if (!(count >= 1)) count = 1;
  if (count > 50) count = 50;

  list.innerHTML = "";
  for (let i = 0; i < count; i++) {
    const row = document.createElement("div");
    row.className = "pw-row";
    const input = document.createElement("input");
    input.readOnly = true;
    input.value = generate(words, digits);
    input.addEventListener("focus", () => input.select());
    const btn = document.createElement("button");
    btn.className = "pw-copy";
    btn.textContent = "Copy";
    btn.addEventListener("click", () => {
      input.select();
      const done = () => { btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 900); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(input.value).then(done, () => { document.execCommand("copy"); done(); });
      } else {
        document.execCommand("copy");
        done();
      }
    });
    row.append(input, btn);
    list.append(row);
  }

  const bits = estBits(words, digits);
  const caveat = bits < 40
    ? `<span class="pw-warn">Roughly ${bits.toFixed(0)} bits</span> &mdash; fine for Wi-Fi, streaming, and PIN-style logins, but too weak for email or banking. Switch to 3 words for anything that matters.`
    : `<span class="pw-warn">Roughly ${bits.toFixed(0)} bits</span> &mdash; reasonable for most accounts. For banking or a password manager master password, either add a word or mix in a symbol the generator did not place.`;
  foot.innerHTML = caveat + `<br>Every password is unique. The leet swap (a&rarr;@, i&rarr;!, o&rarr;0, e&rarr;3, s&rarr;$) adds a few more bits on top.`;
}

document.getElementById("go").addEventListener("click", render);
document.getElementById("copyAll").addEventListener("click", () => {
  const all = Array.from(list.querySelectorAll("input")).map(i => i.value).join("\n");
  const btn = document.getElementById("copyAll");
  const done = () => { btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy all"), 900); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(all).then(done, done);
  } else {
    done();
  }
});
["words", "digits", "count"].forEach(id =>
  document.getElementById(id).addEventListener("change", render));

render();
</script>
</body>
</html>
